<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --accent: #ff0000;
      --text: #ffffff;
      --muted: #aaaaaa;
      --border: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    h1 {
      text-align: center;
      font-size: 1.9rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff0000, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input[type="url"] {
      flex: 1;
      background: #111;
      border: 1px solid var(--border);
      color: white;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    input[type="url"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #e60000;
    }

    button:active {
      transform: scale(0.97);
    }

    .options {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .options label {
      background: #222;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .options input {
      display: none;
    }

    .options input:checked + label {
      background: #ff000022;
      border-color: var(--accent);
      color: #ff6b6b;
    }

    #preview {
      display: none;
      margin-top: 24px;
      text-align: center;
    }

    #preview img {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    #title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .download-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .download-links a {
      display: block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: 500;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .download-links a:hover {
      background: #2a2a2a;
      border-color: var(--accent);
      color: #ff6b6b;
    }

    .note {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .loader {
      display: none;
      text-align: center;
      margin: 20px 0;
      color: var(--muted);
    }

    @media (max-width: 500px) {
      .input-group {
        flex-direction: column;
      }
      button {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube Downloader</h1>
    <p class="subtitle">v1.1</p>

    <div class="card">
      <div class="input-group">
        <input type="url" id="url" placeholder="Tempel link YouTube di sini..." autocomplete="off" />
        <button onclick="proses()">Cari</button>
      </div>

      <div class="options">
        <input type="radio" name="tipe" id="video" value="video" checked />
        <label for="video">Video (MP4)</label>

        <input type="radio" name="tipe" id="audio" value="audio" />
        <label for="audio">Audio (MP3)</label>
      </div>

      <div class="loader" id="loader">Memuat info video...</div>

      <div id="preview">
        <img id="thumb" src="" alt="Thumbnail" />
        <div id="title"></div>
        <div class="download-links" id="links"></div>
      </div>
    </div>

    <p class="note">
      by jepri.<br>
    </p>
  </div>

  <script>
    function extractId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function proses() {
      const url = document.getElementById("url").value.trim();
      const id = extractId(url);

      if (!id) {
        alert("Link YouTube tidak valid!");
        return;
      }

      const loader = document.getElementById("loader");
      const preview = document.getElementById("preview");
      const links = document.getElementById("links");
      const isAudio = document.getElementById("audio").checked;

      loader.style.display = "block";
      preview.style.display = "none";
      links.innerHTML = "";

      // Thumbnail
      document.getElementById("thumb").src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;

      // Ambil judul via oEmbed (public)
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        const data = await res.json();
        document.getElementById("title").textContent = data.title;
      } catch (e) {
        document.getElementById("title").textContent = "Judul tidak tersedia";
      }

      // Buat link ke layanan third-party
      const fullUrl = `https://www.youtube.com/watch?v=${id}`;

      const services = [
        {
          name: "y2mate.com",
          url: `https://www.y2mate.com/youtube/${id}`
        },
        {
          name: "SaveFrom.net",
          url: `https://en.savefrom.net/#url=${encodeURIComponent(fullUrl)}`
        },
        {
          name: "9xbuddy",
          url: `https://9xbuddy.com/process?url=${encodeURIComponent(fullUrl)}`
        },
        {
          name: "SSYouTube",
          url: `https://ssyoutube.com/watch?v=${id}`
        }
      ];

      services.forEach(s => {
        const a = document.createElement("a");
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = isAudio 
          ? `Download MP3 via ${s.name}` 
          : `Download MP4 via ${s.name}`;
        links.appendChild(a);
      });

      loader.style.display = "none";
      preview.style.display = "block";
    }

    // Enter key support
    document.getElementById("url").addEventListener("keypress", function(e) {
      if (e.key === "Enter") proses();
    });
  </script>
</body>
</html>
